/* Reference screenshot parity: content width, portrait game art and service marks */
:root{--width:1392px}
.game-card{aspect-ratio:4/5}
.game-card img{object-fit:cover;object-position:center center}
.service-mark:after{bottom:-4px;right:-8px;font-size:13px}

/* Genuine logo vector artwork, with responsive card sizing. */
.service-card{height:auto!important;aspect-ratio:5/3;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;letter-spacing:-.8px}
.service-logo-set{display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;line-height:1}
.service-r-symbol{width:33px;height:34px;display:block;flex-shrink:0;overflow:visible}
.service-service-name{font-size:25px;font-weight:700}
.service-gta-mark{width:96px;height:62px;display:block;object-fit:contain;overflow:visible}
@media(max-width:560px){.service-card{aspect-ratio:auto;min-height:118px}.service-logo-set{gap:3px}.service-r-symbol{width:30px;height:32px}.service-service-name{font-size:19px}.service-gta-mark{width:78px;height:52px}}

/* Common Solutions: align dimensions and icon treatment to reference. */
:root{--width:1710px}
.container{width:calc(100% - 7.4%)}
.solutions-grid{column-gap:16px;row-gap:16px}
.solution-card{min-height:108px;padding:24px 27px;gap:23px;border-radius:10px}
.solution-icon{width:38px;height:38px;flex:0 0 38px;color:#dedede;display:grid;place-items:center}
.solution-icon svg{width:36px;height:36px;display:block;overflow:visible}
.solution-card .solution-name{font-size:20px;line-height:1.15;letter-spacing:-.45px;margin-bottom:5px}
.solution-desc{font-size:15px;line-height:1.2;color:#b5b5ba}
@media(max-width:980px){.container{width:calc(100% - 48px)}.solution-card{padding:18px 20px;gap:15px;min-height:100px}.solution-card .solution-name{font-size:17px}.solution-desc{font-size:13px}}

/* Assets and icons taken directly from the user-supplied original HTML capture. */
.brand-symbol{width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center}
.brand-symbol svg{width:32px;height:32px;display:block;color:#fff}
.solution-icon{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center}
.solution-icon .original-solution-icon{width:36px;height:36px;display:block;object-fit:contain}
.solution-card{background:#222}
.service-card{background:#222;display:flex;justify-content:center;align-items:center}
.service-card .original-service-logo{display:block;max-width:78%;height:auto;object-fit:contain}
.service-card .original-service-logo[alt="Rockstar Store"]{width:145px}
.service-card .original-service-logo[alt="Rockstar Games Account"]{width:195px}
.service-card .original-service-logo[alt="GTA+ Subscription"]{width:101px;max-height:90px}
.service-card .original-service-logo[alt="Rockstar Games Launcher"]{width:211px}
.community-brands img{display:block;height:25px;width:auto;object-fit:contain}
.community-brands{gap:19px}
.social-links svg{width:19px;height:19px;fill:currentColor;display:block}
.game-card img{object-fit:cover;object-position:center}

function pageHead(title,desc,eyebrow='Support'){return `<div class="page-hero"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>`}
function pageHTML(path,query){
 if(path==='home'||path==='')return homeHTML();
 if(path==='legal')return `<main class="container page-main home-reveal"><div class="page-hero"><div class="eyebrow">Legal information</div><h1>Unofficial fan project</h1><p>This independent design concept is not affiliated with, sponsored by, or endorsed by Rockstar Games or Take-Two Interactive.</p></div><div class="notice-card"><strong>Important disclaimer.</strong> The Rockstar Games name, logos, and game artwork belong to their respective rights holders. This website is an unofficial recreation for visual demonstration purposes. It does not operate Rockstar Games customer support, manage accounts, accept passwords, or process support tickets. For real assistance, use <a href="https://support.rockstargames.com/">official Rockstar Games Support</a>. For Rockstar Games' legal terms, visit <a href="https://www.rockstargames.com/legal">their official Legal page</a>.</div><div class="detail-actions" style="margin-bottom:100px"><a class="secondary-link" href="#/home">Back to home</a><a class="primary-link" href="https://www.rockstargames.com/legal">Rockstar Games legal information ↗</a></div></main>`;
 if(path==='solutions')return `<main class="container page-main home-reveal">${pageHead('Common Solutions','Browse common topics. Account changes and requests open only on the official Rockstar Support website.')}${disclaimerHTML()}${solutionsHTML()}<div style="height:110px"></div></main>`;

 if(path==='services')return `<main class="container page-main home-reveal">${pageHead('Services','Choose a service to continue at the official Rockstar Games support site.')}${servicesHTML()}${stillHelpHTML()}</main>`;
 if(path==='status')return `<main class="container page-main home-reveal">${pageHead('Service Status','Check current availability using the official Rockstar Games service status page.')}<div class="notice-card"><strong>Live status is not connected.</strong> The cards below are interface placeholders, not real-time availability reports. For real status, visit <a href="${OFFICIAL}" target="_blank" rel="noopener noreferrer"><u>Rockstar Games Support ↗</u></a>.</div><div class="status-layout">${['GTA Online','Rockstar Games Services','Red Dead Online','Rockstar Games Launcher'].map(g=>`<div class="status-card"><div><h3>${g}</h3><small>Demo service listing</small></div><div class="status-badge"><span class="status-dot"></span> Not connected</div></div>`).join('')}</div>${stillHelpHTML()}</main>`;
 if(path==='dashboard')return `<main class="container page-main home-reveal">${pageHead('My Dashboard','Track requests and manage your account on the official Rockstar Games support site.')}<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><h2>Your requests live on the official website</h2><p>This demo does not have user accounts or support tickets. It will never ask you to sign in or enter personal information.</p><a href="${OFFICIAL}" target="_blank" rel="noopener noreferrer" class="primary-link">Open official Rockstar Support ↗</a></div></main>`;
 if(path.startsWith('solution/')){const s=solutions.find(s=>s.id===path.slice(9));return s?`<main class="container page-main home-reveal"><div class="article-view"><a class="back-link" href="#/solutions">← &nbsp; Common Solutions</a><div class="article-meta">${escapeHTML(s.subtitle)}</div><h1>${escapeHTML(s.title)}</h1>${disclaimerHTML()}<p class="article-lead">${escapeHTML(s.body)}</p><div class="detail-actions"><a class="primary-link" target="_blank" rel="noopener noreferrer" href="${OFFICIAL}">Go to official support ↗</a><a class="secondary-link" href="#/home">Back to Home</a></div></div></main>`:notFound()}
 if(path.startsWith('game/')){const g=games.find(g=>g.id===path.slice(5));return g?`<main class="container page-main home-reveal">${pageHead(escapeHTML(g.name),'Game support details are available on the official Rockstar website.')}<div class="game-detail-cover"><img src="${assetData[g.asset]}" alt="${escapeHTML(g.name)} illustration"></div>${disclaimerHTML()}<div class="detail-actions" style="margin-bottom:100px"><a class="primary-link" href="${OFFICIAL}" target="_blank" rel="noopener noreferrer">Visit official support ↗</a><a class="secondary-link" href="#/games">All games</a></div></main>`:notFound()}
 if(path.startsWith('article/')){const a=articles.find(a=>a.id===path.slice(8));return a?`<main class="container page-main home-reveal"><div class="article-view"><a class="back-link" href="#/articles">← &nbsp; All articles</a><div class="article-meta"><span>${escapeHTML(a.category)}</span><span class="article-divider"></span><span>${escapeHTML(a.date)}</span></div><h1>${escapeHTML(a.title)}</h1><p class="article-lead">${escapeHTML(a.description)}</p>${disclaimerHTML()}<div class="article-body"><h2>About this topic</h2><p>${escapeHTML(a.body)}</p><p>Content here is sample text for the UI demonstration. Please confirm current details with Rockstar Games before acting on the information.</p></div><div class="detail-actions"><a href="${OFFICIAL}" target="_blank" rel="noopener noreferrer" class="primary-link">Visit official Rockstar Support ↗</a><a href="#/articles" class="secondary-link">More articles</a></div></div></main>`:notFound()}

function notFound(){return `<main class="container page-main">${pageHead('Page not found','The page you requested does not exist in this demo.')}<p><a class="primary-link" href="#/home">Back to home</a></p></main>`}
function searchEntries(term){const t=term.toLowerCase().trim();const entries=[...solutions.map(s=>({title:s.title,category:s.subtitle,url:officialLinks.solution[s.id],description:s.body})),...articles.map(a=>({title:a.title,category:a.category,url:'https://support.rockstargames.com/articles',description:a.description})),...games.map(g=>({title:g.name,category:'Games',url:officialLinks.game[g.id],description:g.name}))];return t?entries.filter(x=>`${x.title} ${x.category} ${x.description}`.toLowerCase().includes(t)):entries}
function updateSuggestions(){let inp=document.getElementById('search-input'),panel=document.getElementById('search-suggestions');if(!inp||!panel)return;let t=inp.value.trim();if(!t){panel.classList.remove('visible');panel.innerHTML='';return}let results=searchEntries(t).slice(0,5);panel.innerHTML=results.length?results.map(x=>`<a class="suggestion" href="${x.url}"><span class="suggestion-title">${escapeHTML(x.title)}</span><span class="suggestion-category">${escapeHTML(x.category)}</span></a>`).join(''):'<div class="suggestion">No results found</div>';panel.classList.add('visible')}
function route(){let hash=window.location.hash||'#/home',raw=hash.startsWith('#/')?hash.slice(2):'home';let [path,params='']=raw.split('?');const dest=path.startsWith('solution/')?officialLinks.solution[path.slice(9)]:path.startsWith('game/')?officialLinks.game[path.slice(5)]:path.startsWith('article/')?'https://support.rockstargames.com/articles':({solutions:'https://support.rockstargames.com/solutions',games:'https://support.rockstargames.com/games',articles:'https://support.rockstargames.com/articles',status:'https://support.rockstargames.com/servicestatus',dashboard:'https://support.rockstargames.com/dashboard',services:'https://support.rockstargames.com'}[path]);if(dest){window.location.replace(dest);return;}let query=new URLSearchParams(params);let nav=path==='status'?'status':path==='dashboard'?'dashboard':'home';app.innerHTML=pageHTML(path,query);document.querySelectorAll('[data-nav]').forEach(el=>{el.classList.toggle('active',el.dataset.nav===nav)});document.title=`${path==='home'?'Home':path.replaceAll('/',' · ').replace(/\b\w/g,c=>c.toUpperCase())} | Support UI Concept`;document.getElementById('main-nav').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'instant'});bindPage();}
function bindPage(){let form=document.getElementById('search-form'),input=document.getElementById('search-input');if(form){form.addEventListener('submit',e=>{e.preventDefault();window.location.assign('https://support.rockstargames.com/articles')})}if(input){input.addEventListener('input',updateSuggestions);input.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('search-suggestions')?.classList.remove('visible')})}}
document.getElementById('menu-toggle').addEventListener('click',()=>{let menu=document.getElementById('main-nav');let open=menu.classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))});
window.addEventListener('hashchange',route);window.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('search-suggestions')?.classList.remove('visible')});route();
</script>
<style>
.service-image-fallback{display:inline-flex;align-items:center;justify-content:center;gap:7px;color:#fff;font-size:26px;font-weight:700;white-space:nowrap}
.service-image-fallback svg{width:29px;height:29px;flex-shrink:0}
.service-image-fallback.gta-fallback{font-family:Arial Black,Arial,sans-serif;font-size:32px;font-weight:1000;letter-spacing:-2.5px;text-transform:lowercase;filter:drop-shadow(2px 3px 0 #000)}
.service-image-fallback.gta-fallback span{font-size:41px;color:#ffbf29}
.community-image-fallback{display:inline-block;color:#fff;font-size:25px;letter-spacing:-.9px}
</style><script>
/* Use original support SVGs where available, with a visible fallback if the remote server blocks hotlinking. */
(function(){
 function fallbackImage(el){
  if(!(el instanceof HTMLImageElement)||!el.isConnected||el.dataset.fallbackApplied)return;
  if(!(el.classList.contains('original-service-logo')||/^(FiveM|RedM) logo$/.test(el.alt)))return;
  el.dataset.fallbackApplied='1';
  const name=el.alt;
  const span=document.createElement('span');
  span.className=el.classList.contains('original-service-logo')?'service-image-fallback':'community-image-fallback';
  if(name==='GTA+ Subscription'){
   span.classList.add('gta-fallback');
   span.innerHTML='gta<span>+</span>';
  }else if(name==='FiveM logo'||name==='RedM logo'){
   span.textContent=name.replace(' logo','');
  }else{
   const mark=document.querySelector('.brand-symbol svg');
   if(mark){const clone=mark.cloneNode(true);clone.setAttribute('aria-hidden','true');span.appendChild(clone)}
   span.appendChild(document.createTextNode(name.replace(/^Rockstar Games /,'').replace(/^Rockstar /,'')));
  }
  el.replaceWith(span);
 }
 document.addEventListener('error',e=>fallbackImage(e.target),true);
 const observer=new MutationObserver(()=>document.querySelectorAll('img.original-service-logo, .community-brands img').forEach(el=>{if(el.complete&&el.naturalWidth===0)fallbackImage(el)}));
 observer.observe(document.body,{subtree:true,childList:true});
 document.querySelectorAll('img.original-service-logo, .community-brands img').forEach(el=>{if(el.complete&&el.naturalWidth===0)fallbackImage(el)});
})();
</script><style>.outline-large,.community-button,.request-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.service-card{text-decoration:none}.header-actions a.user-action{display:inline-flex;align-items:center;justify-content:center}</style></body>
</html>
